steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_API_URL=${_VITE_API_URL}
      - --build-arg
      - VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID}
      - --build-arg
      - VITE_DODO_MODE=${_VITE_DODO_MODE}
      - --build-arg
      - VITE_META_PIXEL_ID=${_VITE_META_PIXEL_ID}
      - --build-arg
      - VITE_GOOGLE_ADS_ID=${_VITE_GOOGLE_ADS_ID}
      - --build-arg
      - VITE_GOOGLE_ADS_SIGNUP_LABEL=${_VITE_GOOGLE_ADS_SIGNUP_LABEL}
      - --build-arg
      - VITE_GOOGLE_ADS_CHECKOUT_LABEL=${_VITE_GOOGLE_ADS_CHECKOUT_LABEL}
      - --build-arg
      - VITE_GOOGLE_ADS_SUBSCRIBE_LABEL=${_VITE_GOOGLE_ADS_SUBSCRIBE_LABEL}
      - --build-arg
      - VITE_REDDIT_PIXEL_ID=${_VITE_REDDIT_PIXEL_ID}
      - --build-arg
      - VITE_TIKTOK_PIXEL_ID=${_VITE_TIKTOK_PIXEL_ID}
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-frontend:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-frontend:latest
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    waitFor: [build]
    args: [push, --all-tags, us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-frontend]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - shortclipr-frontend
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-frontend:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --concurrency=80
      - --min-instances=0
      - --max-instances=5
      - --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=10,failureThreshold=6
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-frontend:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-frontend:latest
options: {logging: CLOUD_LOGGING_ONLY}
