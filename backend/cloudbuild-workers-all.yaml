# One-shot deploy for ALL worker services in the workers project.
#
# Builds the shared image once, then in parallel deploys:
#   - shortclipr-api-worker-{_API_REGION}      (1 service)
#   - shortclipr-ffmpeg-worker-{region}         (one per comma-separated region in _FFMPEG_REGIONS)
#
# Set up as a single Cloud Build trigger in the workers project, main branch.
# Configure region lists via Substitution variables on the trigger.

substitutions:
  # Where the API worker gets deployed. Only one API region needed for most workloads
  # (I/O-bound, 60 concurrent jobs per instance × 5 instances = plenty).
  _API_REGION: 'us-central1'

  # Comma-separated regions where FFmpeg workers get deployed.
  # Each region = one Cloud Run service, one URL to add to FFMPEG_WORKER_URLS.
  # Example: 'us-central1,europe-west1,asia-south1'
  _FFMPEG_REGIONS: 'us-central1,europe-west1'

  # Per-instance sizing (rarely need to override).
  _API_CPU: '4'
  _API_MAX_INSTANCES: '5'
  _FFMPEG_CPU: '4'
  _FFMPEG_MAX_INSTANCES: '5'

steps:
  # ── 1. Build shared image ──────────────────────────────────────────────
  # Same Docker image serves both worker types — they differ only in Cloud
  # Run resource shape (memory/cpu/concurrency/timeout) and which /internal
  # endpoint the watcher hits.
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:latest'
      - './backend'

  # ── 2. Push both tags to Artifact Registry ────────────────────────────
  - id: push
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build']
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker'

  # ── 3a. Deploy API worker (parallel with 3b) ──────────────────────────
  # Shape: 2Gi / 4 vCPU / concurrency 12 / timeout 300s — I/O bound.
  - id: deploy-api-worker
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['push']
    args:
      - 'run'
      - 'deploy'
      - 'shortclipr-api-worker-${_API_REGION}'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
      - '--region=${_API_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=2Gi'
      - '--cpu=${_API_CPU}'
      - '--cpu-boost'
      - '--no-cpu-throttling'
      - '--timeout=300'
      - '--concurrency=12'
      - '--min-instances=0'
      - '--max-instances=${_API_MAX_INSTANCES}'

  # ── 3b. Deploy FFmpeg workers to every region in _FFMPEG_REGIONS ──────
  # Shape: 8Gi / 4 vCPU / concurrency 2 / timeout 1500s — CPU bound.
  # Regions deploy sequentially (~30-40s each). If you regularly deploy
  # to 4+ regions and want parallelism, split into per-region steps.
  - id: deploy-ffmpeg-workers
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    waitFor: ['push']
    args:
      - '-c'
      - |
        set -euo pipefail
        for region in $$(echo "${_FFMPEG_REGIONS}" | tr ',' ' '); do
          region=$$(echo "$$region" | xargs)   # trim whitespace
          [ -z "$$region" ] && continue
          echo "=== Deploying shortclipr-ffmpeg-worker-$$region ==="
          gcloud run deploy "shortclipr-ffmpeg-worker-$$region" \
            --image="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA" \
            --region="$$region" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=8Gi \
            --cpu=${_FFMPEG_CPU} \
            --cpu-boost \
            --no-cpu-throttling \
            --timeout=1500 \
            --concurrency=2 \
            --min-instances=0 \
            --max-instances=${_FFMPEG_MAX_INSTANCES}
        done

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  # Bash loop can produce more output than default; bump to E2_HIGHCPU_8 if builds slow.
  machineType: 'E2_HIGHCPU_8'
