# One-shot deploy for ALL worker services in the workers project.
#
# Builds the shared image once, then in parallel deploys:
#   - shortclipr-api-worker-{_API_REGION}                (1 service)
#   - shortclipr-ffmpeg-worker-{_FFMPEG_REGION_1..4}     (0-4 services)
#
# Set up as a single Cloud Build trigger in the workers project, main branch.
# Configure region slots via Substitution variables on the trigger.
# Leave a slot blank to skip that region.

substitutions:
  # Where the API worker gets deployed. Only one API region needed for most
  # workloads (I/O-bound, 60 concurrent jobs × 5 instances = plenty).
  _API_REGION: 'us-central1'

  # FFmpeg worker region slots. Set 1-4 as needed; leave blank to skip.
  # Each set slot becomes one Cloud Run service — add its URL to
  # FFMPEG_WORKER_URLS on the API + watcher in the main project afterwards.
  _FFMPEG_REGION_1: 'us-central1'
  _FFMPEG_REGION_2: 'europe-west1'
  _FFMPEG_REGION_3: ''
  _FFMPEG_REGION_4: ''

  # Per-instance sizing (rarely need to override).
  _API_CPU: '4'
  _API_MAX_INSTANCES: '5'
  _FFMPEG_CPU: '4'
  _FFMPEG_MAX_INSTANCES: '5'

steps:
  # ── 1. Build shared image ──────────────────────────────────────────────
  # Same Docker image serves both worker types — they differ only in Cloud
  # Run resource shape (memory/cpu/concurrency/timeout) and which /internal
  # endpoint the watcher hits.
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:latest'
      - './backend'

  # ── 2. Push both tags to Artifact Registry ────────────────────────────
  - id: push
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build']
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker'

  # ── 3. Deploy API worker (parallel with all ffmpeg deploys) ───────────
  # Shape: 2Gi / 4 vCPU / concurrency 12 / timeout 300s — I/O bound.
  - id: deploy-api-worker
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['push']
    args:
      - 'run'
      - 'deploy'
      - 'shortclipr-api-worker-${_API_REGION}'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
      - '--region=${_API_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=2Gi'
      - '--cpu=${_API_CPU}'
      - '--cpu-boost'
      - '--no-cpu-throttling'
      - '--timeout=300'
      - '--concurrency=12'
      - '--min-instances=0'
      - '--max-instances=${_API_MAX_INSTANCES}'

  # ── 4a. Deploy FFmpeg worker to region slot 1 ─────────────────────────
  # Shape: 8Gi / 4 vCPU / concurrency 2 / timeout 1500s — CPU bound.
  # Skips gracefully if slot is blank so you never have to edit the yaml
  # to add/remove regions — just toggle the substitution on the trigger.
  - id: deploy-ffmpeg-worker-1
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    waitFor: ['push']
    args:
      - '-c'
      - |
        R='${_FFMPEG_REGION_1}'
        if [ -z "$$R" ]; then echo "Slot 1 empty — skipping"; exit 0; fi
        echo "=== Deploying shortclipr-ffmpeg-worker-$$R ==="
        gcloud run deploy "shortclipr-ffmpeg-worker-$$R" \
          --image="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA" \
          --region="$$R" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=8Gi \
          --cpu=${_FFMPEG_CPU} \
          --cpu-boost \
          --no-cpu-throttling \
          --timeout=1500 \
          --concurrency=2 \
          --min-instances=0 \
          --max-instances=${_FFMPEG_MAX_INSTANCES}

  # ── 4b. Deploy FFmpeg worker to region slot 2 ─────────────────────────
  - id: deploy-ffmpeg-worker-2
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    waitFor: ['push']
    args:
      - '-c'
      - |
        R='${_FFMPEG_REGION_2}'
        if [ -z "$$R" ]; then echo "Slot 2 empty — skipping"; exit 0; fi
        echo "=== Deploying shortclipr-ffmpeg-worker-$$R ==="
        gcloud run deploy "shortclipr-ffmpeg-worker-$$R" \
          --image="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA" \
          --region="$$R" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=8Gi \
          --cpu=${_FFMPEG_CPU} \
          --cpu-boost \
          --no-cpu-throttling \
          --timeout=1500 \
          --concurrency=2 \
          --min-instances=0 \
          --max-instances=${_FFMPEG_MAX_INSTANCES}

  # ── 4c. Deploy FFmpeg worker to region slot 3 ─────────────────────────
  - id: deploy-ffmpeg-worker-3
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    waitFor: ['push']
    args:
      - '-c'
      - |
        R='${_FFMPEG_REGION_3}'
        if [ -z "$$R" ]; then echo "Slot 3 empty — skipping"; exit 0; fi
        echo "=== Deploying shortclipr-ffmpeg-worker-$$R ==="
        gcloud run deploy "shortclipr-ffmpeg-worker-$$R" \
          --image="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA" \
          --region="$$R" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=8Gi \
          --cpu=${_FFMPEG_CPU} \
          --cpu-boost \
          --no-cpu-throttling \
          --timeout=1500 \
          --concurrency=2 \
          --min-instances=0 \
          --max-instances=${_FFMPEG_MAX_INSTANCES}

  # ── 4d. Deploy FFmpeg worker to region slot 4 ─────────────────────────
  - id: deploy-ffmpeg-worker-4
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    waitFor: ['push']
    args:
      - '-c'
      - |
        R='${_FFMPEG_REGION_4}'
        if [ -z "$$R" ]; then echo "Slot 4 empty — skipping"; exit 0; fi
        echo "=== Deploying shortclipr-ffmpeg-worker-$$R ==="
        gcloud run deploy "shortclipr-ffmpeg-worker-$$R" \
          --image="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA" \
          --region="$$R" \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=8Gi \
          --cpu=${_FFMPEG_CPU} \
          --cpu-boost \
          --no-cpu-throttling \
          --timeout=1500 \
          --concurrency=2 \
          --min-instances=0 \
          --max-instances=${_FFMPEG_MAX_INSTANCES}

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:latest'

options:
  logging: CLOUD_LOGGING_ONLY
