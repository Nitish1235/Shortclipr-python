# Compatibility build configuration for the existing “workers all” Cloud Build
# trigger. It retains the split-worker architecture: planning/API work and
# FFmpeg rendering use different images and Cloud Run service shapes.
#
# Override the region slots in the Cloud Build trigger when required. A blank
# FFmpeg slot is skipped; duplicate slots are skipped to avoid two deploys
# racing to update the same Cloud Run service.
substitutions:
  _API_REGION: us-central1
  _FFMPEG_REGION_1: us-central1
  _FFMPEG_REGION_2: europe-west1
  _API_CPU: '4'
  _API_MAX_INSTANCES: '5'
  _FFMPEG_CPU: '4'
  _FFMPEG_MAX_INSTANCES: '5'

steps:
  - id: build-api-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile.api-worker
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api-worker:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api-worker:latest
      - ./backend

  - id: build-ffmpeg-worker
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -f
      - backend/Dockerfile.ffmpeg-worker
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-ffmpeg-worker:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-ffmpeg-worker:latest
      - ./backend

  - id: push-api-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api-worker]
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api-worker

  - id: push-ffmpeg-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [build-ffmpeg-worker]
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-ffmpeg-worker

  - id: deploy-api-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-api-worker]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - shortclipr-api-worker-${_API_REGION}
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api-worker:$COMMIT_SHA
      - --region=${_API_REGION}
      - --platform=managed
      - --update-env-vars=LOG_LEVEL=info
      - --allow-unauthenticated
      - --port=8080
      - --memory=2Gi
      - --cpu=${_API_CPU}
      - --cpu-boost
      - --no-cpu-throttling
      - --timeout=600
      - --concurrency=12
      - --min-instances=0
      - --max-instances=${_API_MAX_INSTANCES}
      - --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=10,failureThreshold=18

  - id: deploy-ffmpeg-worker-1
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-ffmpeg-worker]
    entrypoint: bash
    args:
      - -ceu
      - |
        region='${_FFMPEG_REGION_1}'
        if [ -z "$$region" ]; then
          echo "FFmpeg slot 1 is empty; skipping deployment."
          exit 0
        fi
        gcloud run deploy "shortclipr-ffmpeg-worker-$${region}" \
          --image="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-ffmpeg-worker:$COMMIT_SHA" \
          --region="$$region" \
          --platform=managed \
          --update-env-vars=LOG_LEVEL=info \
          --allow-unauthenticated \
          --port=8080 \
          --memory=4Gi \
          --cpu=${_FFMPEG_CPU} \
          --cpu-boost \
          --no-cpu-throttling \
          --timeout=1500 \
          --concurrency=1 \
          --min-instances=0 \
          --max-instances=${_FFMPEG_MAX_INSTANCES} \
          --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=10,failureThreshold=30

  - id: deploy-ffmpeg-worker-2
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-ffmpeg-worker]
    entrypoint: bash
    args:
      - -ceu
      - |
        region='${_FFMPEG_REGION_2}'
        if [ -z "$$region" ]; then
          echo "FFmpeg slot 2 is empty; skipping deployment."
          exit 0
        fi
        if [ "$$region" = "${_FFMPEG_REGION_1}" ]; then
          echo "FFmpeg slot 2 duplicates slot 1; skipping to avoid a deploy race."
          exit 0
        fi
        gcloud run deploy "shortclipr-ffmpeg-worker-$${region}" \
          --image="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-ffmpeg-worker:$COMMIT_SHA" \
          --region="$$region" \
          --platform=managed \
          --update-env-vars=LOG_LEVEL=info \
          --allow-unauthenticated \
          --port=8080 \
          --memory=4Gi \
          --cpu=${_FFMPEG_CPU} \
          --cpu-boost \
          --no-cpu-throttling \
          --timeout=1500 \
          --concurrency=1 \
          --min-instances=0 \
          --max-instances=${_FFMPEG_MAX_INSTANCES} \
          --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=10,failureThreshold=30

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api-worker:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api-worker:latest
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-ffmpeg-worker:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-ffmpeg-worker:latest

options:
  logging: CLOUD_LOGGING_ONLY
