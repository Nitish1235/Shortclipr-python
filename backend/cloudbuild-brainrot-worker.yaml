substitutions:
  # Cloud Run deploy region — pass via --substitutions _REGION=us-east1 on
  # the trigger for each additional region. Image is always built/pushed to
  # the SAME us-central1 Artifact Registry repo regardless of deploy region.
  _REGION: 'us-central1'
  # 2 vCPU + --concurrency 2 below: 2 brainrot renders can share one
  # instance. Each render's own -threads/-filter_complex_threads is sized
  # at request time from _ACTIVE_RENDERS_ON_INSTANCE (brainrot_stage.py) —
  # 1 job alone gets both vCPUs, a 2nd job landing on the same instance
  # drops both to 1 thread each. Must match BRAINROT_WORKER_VCPUS in
  # app/core/config.py. _MAX_INSTANCES left at 5 (unchanged from the old
  # 4-vCPU config) pending a check of actual regional CPU quota headroom —
  # at 2 vCPU/instance this pool now uses half the CPU quota it used to for
  # the same instance count, so there's room to raise this later if the
  # quota (shared with the other worker pools in this project) allows it.
  _CPU: '2'
  _MAX_INSTANCES: '5'

steps:
  # ── 1. Build image ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:latest'
      - './backend'

  # ── 2. Push both tags to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker'

  # ── 3. Deploy Brainrot worker to Cloud Run ─────────────────────────────────
  # shortclipr-brainrot-worker-$_REGION handles the Brainrot pipeline stage:
  #   /internal/brainrot-stage/run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shortclipr-brainrot-worker-$_REGION'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

      # ── Resources ────────────────────────────────────────────────────────
      # 4Gi: 2 concurrent renders, each holding a downloaded gameplay clip +
      # character PNGs + TTS/music/SFX audio + ffmpeg's own working buffers
      # in memory at once. brainrot_gameplay.py's own sizing note puts a
      # single reframe ffmpeg at ~300-500MB; brainrot_composite.render()'s
      # multi-input filter graph (video + N audio inputs + ASS captions) is
      # heavier, so budget generously — 2 × ~1GiB render footprint + Python/
      # uvicorn base leaves comfortable headroom under 4Gi without paying for
      # the old 8Gi (sized for a single 4-vCPU job that no longer exists).
      # Watch actual memory on the first deploy and raise back to 8Gi if it's
      # ever tight — this is an estimate, not a measurement.
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '$_CPU'
      - '--cpu-boost'
      - '--no-cpu-throttling'

      # ── Timeout ──────────────────────────────────────────────────────────
      - '--timeout'
      - '1500'

      # ── Concurrency ──────────────────────────────────────────────────────
      # 2 requests per instance. Unlike the main FFmpeg worker (1 job needs
      # the full 4 vCPU, so concurrency=1 there), brainrot's composite render
      # is lighter — 2 jobs sharing 2 vCPU (1 thread each, see
      # _ACTIVE_RENDERS_ON_INSTANCE in brainrot_stage.py) is the target
      # shape. Must be <= BRAINROT_REGION_SOFT_CAP's per-instance assumption
      # in the watcher (watcher/config.py) — see that file's comment.
      - '--concurrency'
      - '2'

      # ── Scaling ──────────────────────────────────────────────────────────
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '$_MAX_INSTANCES'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:latest'

options:
  logging: CLOUD_LOGGING_ONLY