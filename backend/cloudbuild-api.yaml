steps:
  # ── 1. Build image ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:latest'
      - './backend'

  # ── 2. Push both tags to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api'

  # ── 3. Deploy to Cloud Run ──────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shortclipr-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

      # ── Resources ────────────────────────────────────────────────────────
      # 1 GiB RAM / 1 vCPU: this service handles auth, job CRUD, payments,
      # webhooks, and metadata — all I/O-bound, no ffmpeg. Heavy work
      # (pipeline runs, clip re-renders) is dispatched to shortclipr-worker
      # (see cloudbuild-worker.yaml) via the env vars below.
      - '--memory'
      - '1024Mi'
      - '--cpu'
      - '1'

      # Normal CPU throttling is fine here — no background asyncio work
      # runs after the response on this service once WORKER_SERVICE_URL
      # is set (pipeline dispatch is a quick fire-and-forget HTTP call).
      - '--cpu-boost'

      # ── Timeout ──────────────────────────────────────────────────────────
      - '--timeout'
      - '300'

      # ── Concurrency ──────────────────────────────────────────────────────
      - '--concurrency'
      - '40'

      # ── Scaling ──────────────────────────────────────────────────────────
      # 1 vCPU/1Gi per instance — region quota (20 vCPU/40GiB) allows up to
      # 20 instances; capped at 10 with headroom for shortclipr-worker.
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

      # NOTE: WORKER_SERVICE_URL, INTERNAL_TASK_SECRET are set once via the
      # Cloud Run Console (Variables & Secrets) — NOT here. `--set-env-vars`
      # would replace ALL existing env vars (DB URL, JWT secret, etc.) on
      # every deploy, so it's intentionally omitted. See deployment.md.

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
