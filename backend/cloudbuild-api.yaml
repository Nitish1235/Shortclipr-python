steps:
  # ── 1. Build image ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:latest'
      - './backend'

  # ── 2. Push both tags to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api'

  # ── 3. Deploy to Cloud Run ──────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shortclipr-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

      # ── Resources ────────────────────────────────────────────────────────
      # 8 GiB RAM / 8 vCPU: FFmpeg encodes run with MAX_CONCURRENT_ENCODES
      # concurrent libx264 processes, plus cheap -c copy extraction
      # (asyncio semaphore = 10) and in-flight temp video data.
      - '--memory'
      - '8192Mi'
      - '--cpu'
      - '8'

      # CPU-boost speeds up cold starts; no-cpu-throttling keeps full CPU
      # available to background asyncio tasks (the pipeline runs via
      # asyncio.create_task AFTER the HTTP response, which Cloud Run would
      # otherwise throttle toward near-zero CPU).
      - '--cpu-boost'
      - '--no-cpu-throttling'

      # ── Timeout ──────────────────────────────────────────────────────────
      # 1200s = 20 min — matches PIPELINE_TIMEOUT_SECONDS in orchestrator.py.
      # A 3-hour video with 15 clips can take up to 15 min end-to-end.
      - '--timeout'
      - '1200'

      # ── Concurrency ──────────────────────────────────────────────────────
      # 5 concurrent requests per instance. MAX_CONCURRENT_ENCODES caps the
      # real CPU-bound work per instance — keeping concurrency lower lets
      # the autoscaler add instances instead of deep-queueing jobs.
      - '--concurrency'
      - '5'

      # ── Scaling ──────────────────────────────────────────────────────────
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
