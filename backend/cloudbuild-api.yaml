steps:
  # ── 1. Build image ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:latest'
      - './backend'

  # ── 2. Push both tags to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api'

  # ── 3. Deploy to Cloud Run ──────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shortclipr-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

      # ── Resources ────────────────────────────────────────────────────────
      # 4 GiB RAM: FFmpeg clips run in parallel (asyncio semaphore = 10),
      # MediaPipe face detection, and multiple in-flight pipelines each
      # hold temp video frames in memory.
      - '--memory'
      - '4096Mi'
      # 2 vCPU: FFmpeg is CPU-intensive. Gives headroom for parallel encodes
      # without throttling the async event loop.
      - '--cpu'
      - '2'

      # ── Timeout ──────────────────────────────────────────────────────────
      # 1200s = 20 min — matches PIPELINE_TIMEOUT_SECONDS in orchestrator.py.
      # A 3-hour video with 15 clips can take up to 15 min end-to-end.
      - '--timeout'
      - '1200'

      # ── Concurrency ──────────────────────────────────────────────────────
      # 10 concurrent requests per instance. Each pipeline spawns up to
      # MAX_CONCURRENT_CLIPS (10) FFmpeg subprocesses — so 10 concurrent
      # requests would already saturate 2 vCPUs. Cloud Run auto-scales
      # new instances beyond this.
      - '--concurrency'
      - '10'

      # ── Scaling ──────────────────────────────────────────────────────────
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
