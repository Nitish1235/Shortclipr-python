name: Backend pipeline validation

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-pipeline.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-pipeline.yml"

permissions:
  contents: read

concurrency:
  group: backend-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests and compile checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile backend modules
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  ffmpeg-worker-image:
    name: Build FFmpeg worker and run linker smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build worker image
        run: docker build --pull -f backend/Dockerfile.ffmpeg-worker -t shortclipr-ffmpeg-worker:ci backend
