# DEPRECATED: Legacy unified worker deployment. New deployments should
# use cloudbuild-api-worker.yaml + cloudbuild-ffmpeg-worker.yaml instead
# (split-worker architecture). This file is kept only to keep existing
# Cloud Build triggers pointing at shortclipr-worker-* services alive
# during the split-worker rollout.

substitutions:
  # Cloud Run deploy region — pass via --substitutions _REGION=us-east1 on
  # the trigger for each additional region. Image is always built/pushed to
  # the SAME us-central1 Artifact Registry repo regardless of deploy region
  # (creating per-region repos is unnecessary extra infra — Cloud Run can
  # pull cross-region, just a few seconds slower on cold start).
  _REGION: 'us-central1'
  # vCPU per instance — also drives how many instances fit in a region's
  # 20,000m CPU quota (see --max-instances comment below). Pass
  # --substitutions _CPU=4,_MAX_INSTANCES=5 to match.
  _CPU: '4'
  _MAX_INSTANCES: '5'

steps:
  # ── 1. Build image ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:latest'
      - './backend'

  # ── 2. Push both tags to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker'

  # ── 3. Deploy to Cloud Run ──────────────────────────────────────────────────
  # shortclipr-worker-$_REGION — one Cloud Run service per region, all built
  # from the SAME image, only ever called via:
  #   - /internal/pipeline/run   (dispatched by the watcher service)
  #   - /internal/editor/render  (direct call from POST /editor/render)
  # Both routes are gated on X-Internal-Secret == INTERNAL_TASK_SECRET.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shortclipr-worker-$_REGION'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      # Allow-unauthenticated like shortclipr-api — /internal/* routes are
      # gated on X-Internal-Secret, matching the existing internal.py model.
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

      # ── Resources ────────────────────────────────────────────────────────
      # FFmpeg encodes run with MAX_CONCURRENT_ENCODES concurrent libx264
      # processes, plus cheap -c copy extraction (asyncio semaphore = 10)
      # and in-flight temp video data. Memory scaled to match _CPU (Cloud
      # Run requires a minimum memory/vCPU ratio) — bump if OOM under load.
      - '--memory'
      - '4096Mi'
      - '--cpu'
      - '$_CPU'

      # CPU-boost speeds up cold starts; no-cpu-throttling keeps full CPU
      # available to background asyncio tasks (the pipeline runs via
      # asyncio.create_task AFTER the HTTP response, which Cloud Run would
      # otherwise throttle toward near-zero CPU).
      - '--cpu-boost'
      - '--no-cpu-throttling'

      # ── Timeout ──────────────────────────────────────────────────────────
      # 1200s = 20 min — matches PIPELINE_TIMEOUT_SECONDS in orchestrator.py.
      # A 3-hour video with 15 clips can take up to 15 min end-to-end.
      - '--timeout'
      - '1200'

      # ── Concurrency ──────────────────────────────────────────────────────
      # 5 concurrent requests per instance. MAX_CONCURRENT_ENCODES caps the
      # real CPU-bound work per instance — keeping concurrency lower lets
      # the autoscaler add instances instead of deep-queueing jobs.
      - '--concurrency'
      - '5'

      # ── Scaling ──────────────────────────────────────────────────────────
      # _MAX_INSTANCES must match: region_quota_m / (_CPU * 1000).
      # At _CPU=4 and a 20,000m regional quota: 20000/4000 = 5.
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '$_MAX_INSTANCES'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/shortclipr-worker:latest'

options:
  logging: CLOUD_LOGGING_ONLY
