<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brainrot Character Selector (112)</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --border: #e0e0e5;
    --text: #1a1a1e;
    --muted: #6a6a75;
    --accent: #cf1322;
    --accent-bg: #fdecee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(245,245,247,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; margin-right: auto; }
  button, select {
    font: inherit;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #f0f0f2; }
  button.primary { background: var(--text); color: white; border-color: var(--text); }
  button.primary:hover { background: #333; }
  #count { font-size: 13px; color: var(--muted); font-weight: 600; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    padding: 16px 20px 100px;
  }
  .card {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .12s, transform .12s;
    position: relative;
    user-select: none;
  }
  .card:hover { transform: translateY(-2px); }
  .card.selected { border-color: var(--accent); background: var(--accent-bg); }
  .card .thumb {
    aspect-ratio: 3/4;
    background: #fafafa repeating-conic-gradient(#f0f0f0 0% 25%, transparent 0% 50%) 50%/16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .card .info { padding: 8px 10px 10px; }
  .card .name { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
  .card .arche { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.2; }
  .card .fam-tag {
    display: inline-block; margin-top: 5px; font-size: 9.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted);
    background: #f0f0f2; padding: 2px 6px; border-radius: 5px;
  }
  .check {
    position: absolute; top: 8px; right: 8px; width: 22px; height: 22px;
    border-radius: 50%; background: rgba(255,255,255,0.9); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900;
    color: white;
  }
  .card.selected .check { background: var(--accent); border-color: var(--accent); }
  #exportBar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; border-top: 1px solid var(--border);
    padding: 12px 20px; display: flex; gap: 10px; align-items: center;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
  }
  #exportOut {
    flex: 1; font-family: ui-monospace, monospace; font-size: 12px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: #fafafa; height: 34px; resize: none; overflow: auto; white-space: nowrap;
  }
  .toast {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: white; padding: 8px 16px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>Brainrot Character Library — 112 characters</h1>
  <select id="familyFilter"><option value="">All families</option></select>
  <button id="selAll">Select all</button>
  <button id="selNone">Deselect all</button>
  <span id="count">0 selected</span>
</header>

<div id="grid"></div>

<div id="exportBar">
  <textarea id="exportOut" readonly placeholder="Selected IDs will appear here as JSON..."></textarea>
  <button class="primary" id="copyBtn">Copy selection</button>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

const grid = document.getElementById('grid');
const familyFilter = document.getElementById('familyFilter');
const countEl = document.getElementById('count');
const exportOut = document.getElementById('exportOut');
const toast = document.getElementById('toast');

const selected = new Set(); // start empty — you pick what you want

// populate family filter
const families = [...new Set(CHARACTERS.map(c => c.family))].sort();
families.forEach(f => {
  const opt = document.createElement('option');
  opt.value = f; opt.textContent = f;
  familyFilter.appendChild(opt);
});

function render() {
  const filterVal = familyFilter.value;
  grid.innerHTML = '';
  CHARACTERS
    .filter(c => !filterVal || c.family === filterVal)
    .forEach(c => {
      const card = document.createElement('div');
      card.className = 'card' + (selected.has(c.id) ? ' selected' : '');
      card.dataset.id = c.id;
      card.innerHTML = `
        <div class="thumb"><img src="assets/${c.id}/canon.png" loading="lazy" alt="${c.name}"></div>
        <div class="info">
          <div class="name">${c.name}</div>
          <div class="arche">${c.archetype}</div>
          <div class="fam-tag">${c.family}</div>
        </div>
        <div class="check">${selected.has(c.id) ? '✓' : ''}</div>
      `;
      card.addEventListener('click', () => {
        if (selected.has(c.id)) selected.delete(c.id); else selected.add(c.id);
        render();
        updateExport();
      });
      grid.appendChild(card);
    });
  countEl.textContent = `${selected.size} selected`;
}

function updateExport() {
  exportOut.value = JSON.stringify([...selected]);
}

familyFilter.addEventListener('change', render);

document.getElementById('selAll').addEventListener('click', () => {
  const filterVal = familyFilter.value;
  CHARACTERS.filter(c => !filterVal || c.family === filterVal).forEach(c => selected.add(c.id));
  render(); updateExport();
});
document.getElementById('selNone').addEventListener('click', () => {
  const filterVal = familyFilter.value;
  if (!filterVal) { selected.clear(); }
  else { CHARACTERS.filter(c => c.family === filterVal).forEach(c => selected.delete(c.id)); }
  render(); updateExport();
});
document.getElementById('copyBtn').addEventListener('click', async () => {
  updateExport();
  try {
    await navigator.clipboard.writeText(exportOut.value);
  } catch (e) {
    exportOut.select();
    document.execCommand('copy');
  }
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1200);
});

render();
updateExport();
</script>
