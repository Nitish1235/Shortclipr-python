server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # nginx sits behind Cloud Run's TLS-terminating proxy — it only ever sees
    # plain HTTP on its own internal listen port (8080), so it has no way to
    # know the request was really HTTPS on the public domain with no port.
    # Left at the default, `rewrite ... permanent` and any other automatic
    # redirect nginx generates would construct an ABSOLUTE Location header
    # from what it thinks it knows: http://<host>:8080/..., leaking the
    # internal port (never publicly reachable — only 443 is exposed at the
    # Cloud Run edge) into a redirect real browsers then hang trying to
    # follow. Emitting relative Location headers instead sidesteps the
    # scheme/host/port guesswork entirely — browsers resolve them against
    # the URL actually requested, which is correct by construction.
    absolute_redirect off;

    # ── Gzip compression ────────────────────────────────────────
    gzip              on;
    gzip_vary         on;          # send Vary: Accept-Encoding header (CDN/proxy aware)
    gzip_proxied      any;         # compress for all proxied requests
    gzip_comp_level   6;           # balanced speed/ratio (1=fastest, 9=best)
    gzip_min_length   1024;        # skip tiny files (< 1 KB) — overhead not worth it
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Legacy URL → /youtube-shorts redirects (301) ────────────
    # Safety net for external traffic (search engines, bookmarks, backlinks)
    # hitting pre-migration URLs. Internal SPA navigation is already
    # updated to the new paths directly — these never fire for in-app use.
    rewrite ^/$                          /youtube-shorts                 permanent;
    rewrite ^/dashboard$                 /youtube-shorts/dashboard       permanent;
    rewrite ^/clips$                     /youtube-shorts/clips           permanent;
    rewrite ^/lab$                       /youtube-shorts/lab             permanent;
    rewrite ^/editor/(.*)$               /youtube-shorts/editor/$1       permanent;
    rewrite ^/tools$                     /youtube-shorts/tools           permanent;
    rewrite ^/tools/(.*)$                /youtube-shorts/tools/$1        permanent;
    rewrite ^/alternatives$              /youtube-shorts/alternatives    permanent;
    rewrite ^/alternatives/(.*)$         /youtube-shorts/alternatives/$1 permanent;

    # Build-time SEO pages create a /youtube-shorts directory without an
    # index.html. Normalize trailing slashes before nginx can treat that
    # directory (or its tools/guides/alternatives subdirectories) as a page.
    rewrite ^(/youtube-shorts(?:/[^/]+)*)/$ $1 permanent;

    # The landing page lives at the build root, even though SEO output also
    # creates a physical /youtube-shorts directory.
    location = /youtube-shorts {
        try_files /index.html =404;
    }

    # Retired Brainrot pages must return a real gone response, including
    # nested guides, tools, login, and studio URLs.
    location = /brainrot {
        add_header X-Robots-Tag "noindex" always;
        return 410;
    }
    location ^~ /brainrot/ {
        add_header X-Robots-Tag "noindex" always;
        return 410;
    }

    # The first batch of comparison pages made claims that are no longer
    # maintained against the current product. Keep only the reviewed OpusClip
    # and Klap pages available; return a real gone response for the retired
    # URLs so crawlers remove old snippets instead of treating a client-side
    # noindex tag as a soft or delayed signal.
    location ~ ^/youtube-shorts/alternatives/(2short|munch|riverside|spikes-studio|vidyo|vizard|vmaker|wisecut)/?$ {
        add_header X-Robots-Tag "noindex" always;
        return 410;
    }

    # Unknown tool, guide, and comparison slugs should be real 404s rather
    # than an apparently successful copy of the homepage HTML shell.
    location ~ ^(?<seo_path>/youtube-shorts/(?:tools|guides|alternatives)/[^/]+)/?$ {
        try_files $seo_path.html =404;
    }

    # Public SEO pages have route-specific HTML generated at build time.
    # The app still takes over after JavaScript loads.
    location / {
        try_files $uri $uri.html /index.html;
    }

    # ── Static asset caching (hashed filenames) ─────────────────
    # Vite appends a content hash to every JS/CSS file (e.g. index-BGpXQQbJ.js)
    # so 1-year cache is safe — hash changes on every new build.
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Image / media caching ───────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Disable access log for health probes ───────────────────
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
