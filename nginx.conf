server {
    listen 8080;
    server_name www.shortclipr.com;
    return 301 https://shortclipr.com$request_uri;
}

server {
    listen 8080 default_server;
    server_name shortclipr.com _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://www.googletagmanager.com https://connect.facebook.net https://www.redditstatic.com https://analytics.tiktok.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src https://accounts.google.com; base-uri 'self'; frame-ancestors 'self'" always;

    location = / { return 301 /animation-maker/; }
    location = /animation-maker { return 301 /animation-maker/; }
    location ^~ /animation-maker/ { try_files $uri $uri/ =404; }
    location = /story-machine { return 301 /animation-maker/; }
    location = /story-machine/ { return 301 /animation-maker/; }
    location ^~ /story-machine/ { return 301 /animation-maker/; }

    # Retired preview and collection aliases keep one permanent canonical URL.
    location = /landing-demo { return 301 /animation-maker/; }
    location = /landing-demo/ { return 301 /animation-maker/; }
    location = /clip-types { return 301 /video-ideas/; }
    location = /clip-types/ { return 301 /video-ideas/; }

    # Article/blog aliases preserve discoverability for older or externally shared URLs.
    location = /articles { return 301 /guides/; }
    location = /articles/ { return 301 /guides/; }
    location ^~ /articles/ { rewrite ^/articles/(.*)$ /guides/$1 permanent; }
    location = /blog { return 301 /guides/; }
    location = /blog/ { return 301 /guides/; }
    location ^~ /blog/ { rewrite ^/blog/(.*)$ /guides/$1 permanent; }

    # Contact/support aliases use one canonical, indexable destination.
    location = /pages/contact { return 301 /contact/; }
    location = /pages/contact/ { return 301 /contact/; }
    location = /support { return 301 /contact/; }
    location = /support/ { return 301 /contact/; }
    location = /contact-us { return 301 /contact/; }
    location = /contact-us/ { return 301 /contact/; }
    location = /contact { return 301 /contact/; }
    location ^~ /contact/ { try_files $uri $uri/ =404; }

    # -----------------------------------------------------------------------
    # Legacy pages (old YouTube-clipper product + brainrot era, removed Nov 2026).
    # 410 Gone signals permanent removal — Google deindexes faster than 404.
    # -----------------------------------------------------------------------
    location = /youtube-shorts { return 410; }
    location = /youtube-shorts/ { return 410; }
    location ^~ /youtube-shorts/ { return 410; }
    location ^~ /brainrot/ { return 410; }
    # Current comparison pages are live and included in the XML sitemap.
    # Serve existing static pages; unknown comparison slugs should return 404.
    location ^~ /compare/ { try_files $uri $uri/ =404; }
    location ^~ /guides/klap-alternative/ { return 410; }
    location ^~ /guides/spikes-studio-alternative/ { return 410; }
    location ^~ /guides/gameplay-shorts/ { return 410; }
    location ^~ /guides/caption-styles/ { return 410; }
    location ^~ /guides/how-to-choose-caption-styles/ { return 410; }
    location = /changelog { return 410; }
    location = /changelog/ { return 410; }

    location ~ ^/(studio|admin)(/.*)?$ { try_files $uri /index.html; }
    location = /login/ { return 301 /login; }
    location = /login { try_files $uri /index.html; }

    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /health { access_log off; return 200 "ok"; add_header Content-Type text/plain; }
}
