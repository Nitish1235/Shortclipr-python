server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────────────
    gzip              on;
    gzip_vary         on;          # send Vary: Accept-Encoding header (CDN/proxy aware)
    gzip_proxied      any;         # compress for all proxied requests
    gzip_comp_level   6;           # balanced speed/ratio (1=fastest, 9=best)
    gzip_min_length   1024;        # skip tiny files (< 1 KB) — overhead not worth it
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── SPA routing — all paths → index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching (hashed filenames) ─────────────────
    # Vite appends a content hash to every JS/CSS file (e.g. index-BGpXQQbJ.js)
    # so 1-year cache is safe — hash changes on every new build.
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Image / media caching ───────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Disable access log for health probes ───────────────────
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
