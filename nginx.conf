server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # nginx sits behind Cloud Run's TLS-terminating proxy — it only ever sees
    # plain HTTP on its own internal listen port (8080), so it has no way to
    # know the request was really HTTPS on the public domain with no port.
    # Left at the default, `rewrite ... permanent` and any other automatic
    # redirect nginx generates would construct an ABSOLUTE Location header
    # from what it thinks it knows: http://<host>:8080/..., leaking the
    # internal port (never publicly reachable — only 443 is exposed at the
    # Cloud Run edge) into a redirect real browsers then hang trying to
    # follow. Emitting relative Location headers instead sidesteps the
    # scheme/host/port guesswork entirely — browsers resolve them against
    # the URL actually requested, which is correct by construction.
    absolute_redirect off;

    # ── Gzip compression ────────────────────────────────────────
    gzip              on;
    gzip_vary         on;          # send Vary: Accept-Encoding header (CDN/proxy aware)
    gzip_proxied      any;         # compress for all proxied requests
    gzip_comp_level   6;           # balanced speed/ratio (1=fastest, 9=best)
    gzip_min_length   1024;        # skip tiny files (< 1 KB) — overhead not worth it
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Legacy URL → /brainrot redirects (301) ──────────────────
    # Root and all bare legacy paths go to brainrot equivalents.
    # /youtube-shorts/* is also redirected — YT-Shorts product is disabled.
    rewrite ^/$                          /brainrot                       permanent;
    rewrite ^/dashboard$                 /brainrot/studio                permanent;
    rewrite ^/clips$                     /brainrot/studio                permanent;
    rewrite ^/lab$                       /brainrot/studio                permanent;
    rewrite ^/editor/(.*)$               /brainrot/studio                permanent;
    rewrite ^/tools$                     /brainrot/tools                 permanent;
    rewrite ^/tools/(.*)$                /brainrot/tools/$1              permanent;
    rewrite ^/alternatives$              /brainrot/alternatives          permanent;
    rewrite ^/alternatives/(.*)$         /brainrot/alternatives/$1       permanent;
    rewrite ^/youtube-shorts/dashboard$  /brainrot/studio                permanent;
    rewrite ^/youtube-shorts/clips$      /brainrot/studio                permanent;
    rewrite ^/youtube-shorts/lab$        /brainrot/studio                permanent;
    rewrite ^/youtube-shorts/editor/(.*)$ /brainrot/studio               permanent;
    rewrite ^/youtube-shorts/settings$   /brainrot/studio                permanent;
    rewrite ^/youtube-shorts/tools$      /brainrot/tools                 permanent;
    rewrite ^/youtube-shorts/tools/(.*)$ /brainrot/tools/$1              permanent;
    rewrite ^/youtube-shorts/alternatives$ /brainrot/alternatives        permanent;
    rewrite ^/youtube-shorts/alternatives/(.*)$ /brainrot/alternatives/$1 permanent;
    rewrite ^/youtube-shorts/guides$     /brainrot/guides                permanent;
    rewrite ^/youtube-shorts/guides/(.*)$ /brainrot/guides/$1            permanent;
    rewrite ^/youtube-shorts(/.*)?$      /brainrot                       permanent;

    # ── SPA routing — all paths → index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching (hashed filenames) ─────────────────
    # Vite appends a content hash to every JS/CSS file (e.g. index-BGpXQQbJ.js)
    # so 1-year cache is safe — hash changes on every new build.
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Image / media caching ───────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Disable access log for health probes ───────────────────
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
