server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://www.googletagmanager.com https://connect.facebook.net https://www.redditstatic.com https://analytics.tiktok.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src https://accounts.google.com; base-uri 'self'; frame-ancestors 'self'" always;

    location = / { return 301 /story-machine/; }
    location = /story-machine { return 301 /story-machine/; }
    location ^~ /story-machine/ { try_files $uri $uri/ =404; }

    # Retired preview and collection aliases keep one permanent canonical URL.
    location = /landing-demo { return 301 /story-machine/; }
    location = /landing-demo/ { return 301 /story-machine/; }
    location = /clip-types { return 301 /video-ideas/; }
    location = /clip-types/ { return 301 /video-ideas/; }

    # -----------------------------------------------------------------------
    # Legacy YouTube-clipper era pages (old product, removed Nov 2026).
    # 410 Gone tells Google these are permanently removed so it deindexes
    # them much faster than a 404 would.
    # -----------------------------------------------------------------------
    location ^~ /youtube-shorts/ { return 410; }
    location ^~ /guides/klap-alternative/ { return 410; }
    location ^~ /guides/spikes-studio-alternative/ { return 410; }
    location ^~ /guides/gameplay-shorts/ { return 410; }
    location ^~ /guides/caption-styles/ { return 410; }
    location ^~ /guides/how-to-choose-caption-styles/ { return 410; }
    location ^~ /compare/ { return 410; }

    location ~ ^/(studio|admin)(/.*)?$ { try_files $uri /index.html; }
    location = /login { try_files $uri /index.html; }

    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /health { access_log off; return 200 "ok"; add_header Content-Type text/plain; }
}
